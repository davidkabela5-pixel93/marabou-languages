name: Marabou CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --check app.js && node --check pedagogy.js && node --check sw.js && node --check ai-client.js && node --check ai/worker.mjs
      - run: node --test ai/worker.test.mjs
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test -- --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  deploy:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: marabou-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html app.js pedagogy.js ai-client.js style.css sw.js manifest.webmanifest _site/
          cp -r icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
